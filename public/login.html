<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — PayBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ─── NAVBAR ─────────────────────────────────────────────── -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">Pay<span>Bridge</span></a>
      <div class="navbar-links">
        <a href="register.html" class="btn btn-primary btn-sm">Register</a>
      </div>
    </div>
  </nav>

  <!-- ─── LOGIN FORM ─────────────────────────────────────────── -->
  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-logo">
        <h2>PayBridge</h2>
        <p>Sign in to your account</p>
      </div>

      <!-- Alert Box -->
      <div class="alert" id="alertBox"></div>

      <form id="loginForm">

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-2" id="submitBtn">
          Login
        </button>

      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register</a>
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type} show`;
    }

    function hideAlert() {
      alertBox.className = 'alert';
    }

    // Redirect if already logged in
    window.addEventListener('load', async () => {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          redirectByRole(data.user.status);
        }
      } catch (err) {
        // not logged in, stay on page
      }
    });

    function redirectByRole(status) {
      if (status === 'user') {
        window.location.href = 'home.html';
      } else if (status === 'admin') {
        window.location.href = 'dashboard.html';
      } else if (status === 'super_admin') {
        window.location.href = 'dashboard.html';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        return showAlert('Email and password are required.');
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            redirectByRole(data.user.status);
          }, 1000);
        } else {
          showAlert(data.message || 'Wrong email or password.');
        }
      } catch (err) {
        showAlert('Server error. Please try again later.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });
  </script>

</body>
</html>
