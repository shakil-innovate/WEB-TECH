<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home — PayBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .home-hero {
      position: relative;
      min-height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      padding-top: 64px;
    }

    .home-hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('../images/bg.jpg');
      background-size: cover;
      background-position: center;
      filter: brightness(0.25);
      z-index: 0;
    }

    .home-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.7));
      z-index: 1;
    }

    .home-hero-content {
      position: relative;
      z-index: 2;
      padding: 2rem;
    }

    .home-hero-content h1 {
      font-size: 2.5rem;
      color: var(--white);
      margin-bottom: 0.75rem;
    }

    .home-hero-content h1 span {
      color: var(--accent);
    }

    .home-hero-content p {
      color: var(--white-60);
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .main-content {
      padding: 3rem 0;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .section-title h3 {
      color: var(--white);
      font-size: 1.2rem;
    }

    .posts-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .post-card {
      background-color: var(--dark-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: var(--transition);
      cursor: pointer;
    }

    .post-card:hover {
      border-color: var(--accent);
      background-color: var(--dark-3);
    }

    .post-info {
      flex: 1;
    }

    .post-title {
      font-weight: 600;
      color: var(--white);
      font-size: 1rem;
      margin-bottom: 0.35rem;
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .post-meta span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .post-amount {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--font-display);
      white-space: nowrap;
    }

    .post-actions {
      display: flex;
      gap: 0.5rem;
    }

    .welcome-banner {
      background: linear-gradient(135deg, var(--dark-2), var(--dark-3));
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-lg);
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .welcome-banner h3 {
      color: var(--white);
      font-family: var(--font-main);
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }

    .welcome-banner p {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- ─── NAVBAR ─────────────────────────────────────────────── -->
  <nav class="navbar">
    <a href="profile.html" class="btn btn-outline btn-sm">Profile</a>
    <div class="navbar-inner">
      <a href="home.html" class="navbar-logo">Pay<span>Bridge</span></a>
      <div class="navbar-links">
        <a href="home.html" class="btn btn-outline btn-sm">Home</a>
        <a href="inbox.html" class="btn btn-outline btn-sm" id="inboxBtn">
          Inbox <span id="unreadBadge" style="display:none; background:var(--accent); color:var(--black); border-radius:50%; padding:1px 6px; font-size:0.7rem; font-weight:700; margin-left:4px;"></span>
        </a>
        <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- ─── HERO ───────────────────────────────────────────────── -->
  <section class="home-hero">
    <div class="home-hero-bg"></div>
    <div class="home-hero-overlay"></div>
    <div class="home-hero-content">
      <h1>Welcome back, <span id="userName">User</span></h1>
      <p>Manage your international payment requests from one place.</p>
      <a href="request.html" class="btn btn-primary btn-lg">
        + Make Payment Request
      </a>
    </div>
  </section>

  <!-- ─── MAIN CONTENT ───────────────────────────────────────── -->
  <div class="page-wrapper">
    <div class="container main-content">

      <!-- Welcome Banner -->
      <div class="welcome-banner">
        <div>
          <h3>Need to pay internationally?</h3>
          <p>Submit a payment request and our agents will handle it for you securely.</p>
        </div>
        <a href="request.html" class="btn btn-primary btn-sm">New Request</a>
      </div>

      <!-- My Requests -->
      <div class="section-title">
        <h3>My Payment Requests</h3>
        <div class="filter-bar" style="margin-bottom:0;">
          <button class="filter-btn active" data-status="all">All</button>
          <button class="filter-btn" data-status="pending">Pending</button>
          <button class="filter-btn" data-status="assigned">Assigned</button>
          <button class="filter-btn" data-status="processing">Processing</button>
          <button class="filter-btn" data-status="completed">Completed</button>
          <button class="filter-btn" data-status="rejected">Rejected</button>
        </div>
      </div>

      <!-- Alert -->
      <div class="alert" id="alertBox"></div>

      <!-- Posts List -->
      <div class="posts-grid" id="postsList">
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <h4>Loading your requests...</h4>
        </div>
      </div>

    </div>
  </div>

  <script>
    let allPosts = [];
    let currentFilter = 'all';

    // ─── CHECK AUTH ─────────────────────────────────────────────
    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (!res.ok) {
          window.location.href = 'login.html';
          return null;
        }
        const data = await res.json();
        if (data.user.status !== 'user') {
          window.location.href = 'dashboard.html';
          return null;
        }
        return data.user;
      } catch {
        window.location.href = 'login.html';
        return null;
      }
    }

    // ─── LOAD POSTS ─────────────────────────────────────────────
    async function loadPosts() {
      try {
        const res = await fetch('/api/posts/my', { credentials: 'include' });
        const data = await res.json();
        allPosts = data.posts || [];
        renderPosts(allPosts);
      } catch {
        showAlert('Failed to load requests.', 'error');
      }
    }

    // ─── LOAD UNREAD COUNT ──────────────────────────────────────
    async function loadUnreadCount() {
      try {
        const res = await fetch('/api/messages/inbox', { credentials: 'include' });
        const data = await res.json();
        const unread = data.unread || 0;
        const badge = document.getElementById('unreadBadge');
        if (unread > 0) {
          badge.textContent = unread;
          badge.style.display = 'inline';
        }
      } catch {}
    }

    // ─── RENDER POSTS ───────────────────────────────────────────
    function renderPosts(posts) {
      const container = document.getElementById('postsList');

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <h4>No payment requests yet</h4>
            <p>Click "Make Payment Request" to get started.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = posts.map(post => `
        <div class="post-card" onclick="window.location.href='inbox.html?postId=${post.id}'">
          <div class="post-info">
            <div class="post-title">${escapeHtml(post.title)}</div>
            <div class="post-meta">
              <span>📅 ${formatDate(post.post_date)}</span>
              <span>🏦 ${escapeHtml(post.recipient_bank || 'N/A')}</span>
              <span>👤 ${escapeHtml(post.recipient_name)}</span>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:1rem;">
            <div class="post-amount">${post.currency} ${parseFloat(post.amount).toFixed(2)}</div>
            <span class="badge badge-${post.status}">${post.status}</span>
          </div>
        </div>
      `).join('');
    }

    // ─── FILTER POSTS ───────────────────────────────────────────
    function filterPosts(status) {
      currentFilter = status;
      if (status === 'all') {
        renderPosts(allPosts);
      } else {
        renderPosts(allPosts.filter(p => p.status === status));
      }
    }

    // ─── FILTER BUTTONS ─────────────────────────────────────────
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterPosts(btn.dataset.status);
      });
    });

    // ─── LOGOUT ─────────────────────────────────────────────────
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      } finally {
        window.location.href = 'login.html';
      }
    });

    // ─── HELPERS ────────────────────────────────────────────────
    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type} show`;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ─── INIT ────────────────────────────────────────────────────
    window.addEventListener('load', async () => {
      const user = await checkAuth();
      if (!user) return;
      document.getElementById('userName').textContent = user.name;
      loadPosts();
      loadUnreadCount();
    });
  </script>

</body>
</html>
