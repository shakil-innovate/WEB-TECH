  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbox — PayBridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .inbox-layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        height: calc(100vh - 64px);
        margin-top: 64px;
      }

      /* ── LEFT PANEL ── */
      .inbox-sidebar {
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background-color: var(--dark);
      }

      .inbox-sidebar-header {
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .inbox-sidebar-header h3 {
        color: var(--white);
        font-size: 1rem;
      }

      .inbox-list {
        flex: 1;
        overflow-y: auto;
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .inbox-item {
        padding: 1rem;
        border-radius: var(--radius);
        cursor: pointer;
        transition: var(--transition);
        border: 1px solid transparent;
      }

      .inbox-item:hover {
        background-color: var(--dark-2);
        border-color: var(--border);
      }

      .inbox-item.active {
        background-color: var(--dark-2);
        border-color: var(--accent);
      }

      .inbox-item.unread {
        border-left: 3px solid var(--accent);
      }

      .inbox-item-title {
        font-weight: 600;
        color: var(--white);
        font-size: 0.88rem;
        margin-bottom: 0.3rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .inbox-item-preview {
        font-size: 0.78rem;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 0.4rem;
      }

      .inbox-item-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .inbox-item-time {
        font-size: 0.72rem;
        color: var(--text-muted);
      }

      /* ── RIGHT PANEL ── */
      .chat-panel {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background-color: var(--black);
      }

      .chat-panel-empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        color: var(--text-muted);
      }

      .chat-panel-empty .empty-icon {
        font-size: 3rem;
        opacity: 0.3;
      }

      .chat-top {
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid var(--border);
        background-color: var(--dark);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .chat-top h4 {
        color: var(--white);
        font-size: 1rem;
        margin-bottom: 0.2rem;
      }

      .chat-top p {
        font-size: 0.78rem;
        color: var(--text-muted);
      }

      .chat-body {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .bubble-wrapper {
        display: flex;
        flex-direction: column;
      }

      .bubble-wrapper.sent {
        align-items: flex-end;
      }

      .bubble-wrapper.received {
        align-items: flex-start;
      }

      .bubble {
        max-width: 65%;
        padding: 0.85rem 1.1rem;
        border-radius: 16px;
        font-size: 0.9rem;
        line-height: 1.5;
        word-break: break-word;
      }

      .bubble.sent {
        background-color: var(--accent);
        color: var(--black);
        border-bottom-right-radius: 4px;
      }

      .bubble.received {
        background-color: var(--dark-2);
        color: var(--white);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }

      .bubble-meta {
        font-size: 0.72rem;
        margin-top: 0.35rem;
        color: var(--text-muted);
        padding: 0 0.25rem;
      }

      .chat-footer {
        padding: 1rem 1.5rem;
        border-top: 1px solid var(--border);
        background-color: var(--dark);
        display: flex;
        gap: 0.75rem;
        align-items: flex-end;
      }

      .chat-footer textarea {
        flex: 1;
        min-height: 48px;
        max-height: 120px;
        resize: none;
        padding: 0.75rem 1rem;
      }

      @media (max-width: 768px) {
        .inbox-layout {
          grid-template-columns: 1fr;
        }

        .inbox-sidebar {
          display: none;
        }

        .inbox-sidebar.mobile-show {
          display: flex;
          position: fixed;
          inset: 64px 0 0 0;
          z-index: 100;
        }
      }
    </style>
  </head>
  <body>

    <!-- ─── NAVBAR ─────────────────────────────────────────────── -->
    <nav class="navbar">
      <div class="navbar-inner">
        <a href="home.html" class="navbar-logo">Pay<span>Bridge</span></a>
        <div class="navbar-links">
          <a href="home.html" class="btn btn-outline btn-sm">Home</a>
          <a href="inbox.html" class="btn btn-primary btn-sm">Inbox</a>
          <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
        </div>
      </div>
    </nav>

    <!-- ─── INBOX LAYOUT ───────────────────────────────────────── -->
    <div class="inbox-layout">

      <!-- LEFT: Conversations List -->
      <div class="inbox-sidebar" id="inboxSidebar">
        <div class="inbox-sidebar-header">
          <h3>My Requests</h3>
          <a href="request.html" class="btn btn-primary btn-sm">+ New</a>
        </div>
        <div class="inbox-list" id="inboxList">
          <div class="empty-state">
            <div class="empty-icon">💬</div>
            <h4>Loading...</h4>
          </div>
        </div>
      </div>

      <!-- RIGHT: Chat Panel -->
      <div class="chat-panel" id="chatPanel">
        <div class="chat-panel-empty" id="chatEmpty">
          <div class="empty-icon">💬</div>
          <h4 style="color:var(--text-light); font-family:var(--font-main);">Select a request to view messages</h4>
          <p style="font-size:0.85rem;">Your conversations with agents will appear here.</p>
        </div>

        <!-- Chat View (hidden initially) -->
        <div id="chatView" style="display:none; flex-direction:column; height:100%;">
          <div class="chat-top">
            <div>
              <h4 id="chatTitle">—</h4>
              <p id="chatStatus">—</p>
            </div>
            <span class="badge" id="chatStatusBadge"></span>
          </div>
          <div class="chat-body" id="chatBody"></div>
          <div class="chat-footer">
            <textarea
              class="form-control"
              id="messageInput"
              placeholder="Type your message..."
            ></textarea>
            <button class="btn btn-primary" id="sendBtn">Send</button>
          </div>
        </div>
      </div>

    </div>

    <script>
      let currentUser = null;
      let currentPostId = null;
      let allPosts = [];
      let pollInterval = null;

      // ─── CHECK AUTH ─────────────────────────────────────────────
      async function checkAuth() {
        try {
          const res = await fetch('/api/auth/me', { credentials: 'include' });
          if (!res.ok) { window.location.href = 'login.html'; return null; }
          const data = await res.json();
          if (data.user.status !== 'user') { window.location.href = 'dashboard.html'; return null; }
          return data.user;
        } catch {
          window.location.href = 'login.html';
          return null;
        }
      }

      // ─── LOAD MY POSTS ──────────────────────────────────────────
      async function loadMyPosts() {
        try {
          const res = await fetch('/api/posts/my', { credentials: 'include' });
          const data = await res.json();
          allPosts = data.posts || [];
          renderInboxList(allPosts);

          // Auto open from URL param
          const params = new URLSearchParams(window.location.search);
          const postId = params.get('postId');
          if (postId) openChat(parseInt(postId));
        } catch {
          document.getElementById('inboxList').innerHTML = `
            <div class="empty-state"><p>Failed to load requests.</p></div>
          `;
        }
      }

      // ─── RENDER INBOX LIST ──────────────────────────────────────
      function renderInboxList(posts) {
        const container = document.getElementById('inboxList');
        if (posts.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📋</div>
              <h4>No requests yet</h4>
              <p>Make a payment request to start.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = posts.map(post => `
          <div class="inbox-item ${post.id === currentPostId ? 'active' : ''}"
              id="inbox-item-${post.id}"
              onclick="openChat(${post.id})">
            <div class="inbox-item-title">${escapeHtml(post.title)}</div>
            <div class="inbox-item-preview">${post.currency} ${parseFloat(post.amount).toFixed(2)} → ${escapeHtml(post.recipient_name)}</div>
            <div class="inbox-item-meta">
              <span class="badge badge-${post.status}">${post.status}</span>
              <span class="inbox-item-time">${formatDate(post.post_date)}</span>
            </div>
          </div>
        `).join('');
      }

      // ─── OPEN CHAT ──────────────────────────────────────────────
      async function openChat(postId) {
        currentPostId = postId;

        // Update active state
        document.querySelectorAll('.inbox-item').forEach(i => i.classList.remove('active'));
        const item = document.getElementById(`inbox-item-${postId}`);
        if (item) item.classList.add('active');

        // Show chat view
        document.getElementById('chatEmpty').style.display = 'none';
        const chatView = document.getElementById('chatView');
        chatView.style.display = 'flex';

        // Set post info
        const post = allPosts.find(p => p.id === postId);
        if (post) {
          document.getElementById('chatTitle').textContent = post.title;
          document.getElementById('chatStatus').textContent = `${post.currency} ${parseFloat(post.amount).toFixed(2)} → ${post.recipient_name}`;
          const badge = document.getElementById('chatStatusBadge');
          badge.textContent = post.status;
          badge.className = `badge badge-${post.status}`;
        }

        await loadMessages(postId);

        // Start polling for new messages
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(() => loadMessages(postId), 5000);
      }

      // ─── LOAD MESSAGES ──────────────────────────────────────────
      async function loadMessages(postId) {
        try {
          const res = await fetch(`/api/messages/${postId}`, { credentials: 'include' });
          const data = await res.json();
          renderMessages(data.messages || []);
        } catch {}
      }

      // ─── RENDER MESSAGES ────────────────────────────────────────
      function renderMessages(messages) {
        const container = document.getElementById('chatBody');
        const wasAtBottom = container.scrollHeight - container.scrollTop === container.clientHeight;

        if (messages.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">💬</div>
              <h4>No messages yet</h4>
              <p>An agent will message you once your request is reviewed.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = messages.map(msg => {
          const isSent = msg.sender_id === currentUser.id;
          return `
            <div class="bubble-wrapper ${isSent ? 'sent' : 'received'}">
              <div class="bubble ${isSent ? 'sent' : 'received'}">
                ${escapeHtml(msg.message)}
              </div>
              <div class="bubble-meta">
                ${isSent ? 'You' : escapeHtml(msg.sender_name)} · ${formatTime(msg.sent_at)}
              </div>
            </div>
          `;
        }).join('');

        // Scroll to bottom
        container.scrollTop = container.scrollHeight;
      }

      // ─── SEND MESSAGE ───────────────────────────────────────────
      document.getElementById('sendBtn').addEventListener('click', sendMessage);
      document.getElementById('messageInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
async function sendMessage() {
  const input = document.getElementById('messageInput');
  const message = input.value.trim();
  if (!message || !currentPostId) return;

  input.value = '';
  input.disabled = true;

  try {
    const res = await fetch('/api/messages/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        post_id: currentPostId,
        message,
        // receiver_id not needed — backend resolves automatically
      }),
    });

    if (res.ok) {
      await loadMessages(currentPostId);
    } else {
      const data = await res.json();
      alert(data.message || 'Failed to send message.');
      input.value = message;
    }
  } catch {
    alert('Server error. Please try again.');
    input.value = message;
  } finally {
    input.disabled = false;
    input.focus();
  }
}

      // ─── LOGOUT ─────────────────────────────────────────────────
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        if (pollInterval) clearInterval(pollInterval);
        try {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
        } finally {
          window.location.href = 'login.html';
        }
      });

      // ─── HELPERS ────────────────────────────────────────────────
      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      function formatTime(dateStr) {
        return new Date(dateStr).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      }

      // ─── INIT ────────────────────────────────────────────────────
      window.addEventListener('load', async () => {
        currentUser = await checkAuth();
        if (!currentUser) return;
        loadMyPosts();
      });
    </script>

  </body>
  </html>
